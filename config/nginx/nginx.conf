# nginx.conf — SNI passthrough proxy
#
# 讀 TLS ClientHello 的 SNI 決定往哪送，之後純 TCP 雙向轉發。不解密，不需要憑證。

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
}

stream {
    log_format sni '$remote_addr [$time_local] sni="$ssl_preread_server_name" '
                   'upstream=$upstream_addr status=$status '
                   'sent=$bytes_sent recv=$bytes_received dur=$session_time';
    access_log /dev/stdout sni;

    # 解析真實目的地用。指向公用 DNS，不能指向本機 smartdns（會解析回 proxy 自己）。
    # 刻意允許 IPv6 —— 取捨見 docs/DECISIONS.md。
    resolver 1.1.1.1 8.8.8.8 valid=60s;
    resolver_timeout 5s;

    # 白名單式 SNI 路由：未列出的 SNI 導到 127.0.0.1:1，連線立即失敗。
    # 允許清單由 scripts/apply-config.sh 依 config/smartdns/domain-set/*.list 產生。
    map $ssl_preread_server_name $sni_upstream {
        hostnames;
        default "127.0.0.1:1";
        include /etc/nginx/generated/sni-allow.conf;
    }

    server {
        listen 443;
        listen [::]:443;

        ssl_preread on;
        proxy_pass $sni_upstream;

        proxy_connect_timeout 5s;
        # 影片串流是長連線
        proxy_timeout 1h;
    }
}
