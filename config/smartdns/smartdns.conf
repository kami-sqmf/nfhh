# smartdns.conf — 引擎 pymumu/smartdns（C 版）
#
# 會變動的兩個 IP 抽在 generated/smartdns/dynamic-ip*.conf，由 scripts/apply-config.sh 產生。
#
# 本檔（config/）唯讀掛在 /etc/smartdns；產生的設定掛在 /etc/smartdns-gen。
# 兩者刻意分開，因為唯讀掛載裡面不能再建立掛載點。

# ── 監聽 ───────────────────────────────────────────────
# [::]:53 在 bindv6only=0 下同時吃 IPv4；來源管制在 config/nft/nfhh.nft
bind [::]:53
bind-tcp [::]:53

# DoT。bind-tls 與憑證路徑由 scripts/sync-cert.sh 產生到 generated/smartdns/dot.conf。
# 該檔必須存在（可為空），否則 smartdns 起不來。
conf-file /etc/smartdns-gen/dot.conf

# ── 上游 ───────────────────────────────────────────────
server-tls 1.1.1.1:853
server-tls 8.8.8.8:853
server 168.95.1.1
server 168.95.192.1

# ── 一般行為 ───────────────────────────────────────────
cache-size 8192
prefetch-domain yes
serve-expired yes
data-dir /var/lib/smartdns
log-level info
log-console yes

# ── 稽核（查詢紀錄）────────────────────────────────────
# 控制平面唯讀掛 smartdns-data 讀這個檔，用途有二：
#   1. 白名單頁顯示「這個網路最近查了什麼」，證明它還在用
#   2. 判斷條目是否活躍，決定要不要自動續期
#
# ⚠️ 這個檔記下每個裝置查過的每個網域。面板刻意分級：一般成員只看得到
#    自己那個 IP 的逐筆內容，admin 只拿得到彙總數字（幾筆、最後一次何時），
#    看不到家人查了哪些網域。改動這個分級前先讀 DECISIONS.md。
#
# 檔案輪替後 inode 會變，控制平面的 tail 必須偵測並重新開檔。
audit-enable yes
audit-file /var/lib/smartdns/audit.log
audit-size 4M
audit-num 2
audit-console no

# ── 平台網域集（自動產生，勿手改）──────────────────────
# 新增平台 = 丟一個 .list 檔進 config/smartdns/domain-set/ 再跑 ./nfhh apply；停用 = 改名成 .disabled。
# ⚠️ 那只是網路層。信件與權限那半見 docs/SETUP.md §6.5 —— 漏掉時面板上看不出來。
conf-file /etc/smartdns-gen/platforms.conf

# ── 來源分組 ───────────────────────────────────────────
# 本層 LAN 回 LAN IP，其餘來源落在 default 組
client-rules 192.168.24.0/22 -group lan
client-rules 127.0.0.0/8 -group lan

# ── 動態 IP 規則（自動產生，勿手改）────────────────────
# ⚠️ 必須拆兩個檔並在 conf-file 這層用 -group 綁組；
#    在被 include 的檔案內寫 -group 不會生效。
conf-file /etc/smartdns-gen/dynamic-ip.conf
conf-file /etc/smartdns-gen/dynamic-ip-lan.conf -group lan
