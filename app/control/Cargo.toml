[package]
name = "nfhh-control"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
hmac = "0.12"
mail-parser = "0.11.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
rust-embed = { version = "8", features = ["mime-guess"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "resident-key-support", "conditional-ui"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
aes-gcm = "0.10"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
# 測試用的軟體 Passkey：能真的產生 WebAuthn 註冊／登入回應，才能整條重播攻擊鏈
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
